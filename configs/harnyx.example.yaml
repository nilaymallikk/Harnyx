# Example Harnyx configuration.
# Secrets are never stored here: api_key_env names the environment variable.
#
#   export HARNYX_ENGINEER_API_KEY=...
#   harnyx optimize --config configs/harnyx.example.yaml --plugin examples.plugins.verify_agent:build

agent:
  name: verify-agent
  max_steps: 8
  system_prompt: "You are an agent that solves tasks by choosing actions."

engineer:
  provider: openai_compatible
  model: Qwen3.5-9B-engineer
  base_url: http://127.0.0.1:8000/v1
  api_key_env: HARNYX_ENGINEER_API_KEY
  temperature: 0.7
  max_tokens: 12288
  prefill_think: true
  require_think: true
  include_response_template: false

optimization:
  candidates: 8            # K, paper reference
  iterations: 3
  reward_metric: delta_average_reward
  valid_bonus: 0.0
  accept_threshold: 0.0
  reject_regressions: true
  allow_regressions: false
  max_traces: 20
  selection_strategy: round_robin
  reward_threshold: 1.0
  smoke_test: false
  patch_cache: true
  accept_first_valid: false

sandbox:
  backend: local           # local | subprocess
  hook_time_budget_ms: 50
  line_budget: 2000
  wall_timeout_seconds: 5.0
  memory_mb: 256
  cpu_seconds: 2
  network: false

evaluation:
  benchmark: verify
  max_tasks: null
  trajectory_dir: null

run_dir: runs
