[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-harness"
version = "0.1.0"
description = "NOVA: learn to improve executable AI-agent harnesses from failure trajectories (a Harness-R1 implementation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "NOVA contributors" }]
keywords = ["agents", "harness", "llm", "reinforcement-learning", "harness-r1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
train = ["trl>=0.11", "transformers>=4.44", "datasets>=2.20", "torch>=2.2"]
dev = ["pytest>=7.0", "ruff>=0.5", "mypy>=1.10", "PyYAML>=6.0"]
docker = ["docker>=7.0"]

[project.scripts]
nova = "nova.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["nova"]
