[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harnyx"
version = "0.1.0"
description = "Harnyx: learn to improve executable AI-agent harnesses from failure trajectories (a Harness-R1 implementation)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nilay Mallik" }]
keywords = ["agents", "harness", "llm", "reinforcement-learning", "harness-r1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nilaymallikk/Harnyx"
Repository = "https://github.com/nilaymallikk/Harnyx"
Issues = "https://github.com/nilaymallikk/Harnyx/issues"
Documentation = "https://github.com/nilaymallikk/Harnyx/tree/main/docs"

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0", "ruff>=0.5", "mypy>=1.10", "PyYAML>=6.0"]

[project.scripts]
harnyx = "harnyx.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harnyx = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["harnyx"]
